name: rebuild-shelf

# 书架不存文章，只负责把各文集仓的已发布文章汇总成一页。
# 触发方式：定时（每天一次）+ 手动 + 各文集仓 push 后发 repository_dispatch。

on:
  schedule:
    - cron: "17 1 * * *" # 每天 01:17 UTC（北京时间 09:17）
  workflow_dispatch:
  repository_dispatch:
    types: [post-published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 拉取各文集并汇总
        run: node scripts/build-shelf.mjs

      - name: 提交生成结果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md feed.xml feeds shelf.json
          if git diff --quiet --cached; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 重建书架 [skip ci]"
            git push
          fi
